server.port=8080
spring.application.name=HL7FHIRTransformer

# Graceful Shutdown (drain in-flight requests/messages before stopping)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.config.import=optional:classpath:fhir-mapping-config.yml

# Logging (Set to INFO in production for better performance)
logging.level.com.al.hl7fhirtransformer=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Admin Credentials
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:${random.uuid}}

# MongoDB Configuration
# WARNING: Default credentials below are for LOCAL DEVELOPMENT ONLY.
# Override via environment variables in production (see .env.example).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://admin:supersecret@localhost:27017/admin?authSource=admin}

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:supersecret}

# Application Queues
app.rabbitmq.queue=hl7-messages-queue
app.rabbitmq.exchange=hl7-messages-exchange
app.rabbitmq.routingkey=hl7.message.routing
app.rabbitmq.output-queue=fhir-messages-queue

# Dead Letter Queue
app.rabbitmq.dlq=hl7-messages-dlq
app.rabbitmq.dlx=hl7-messages-dlx
app.rabbitmq.dl-routingkey=hl7.message.dl

# Async FHIR to HL7
app.rabbitmq.fhir.exchange=fhir-messages-exchange
app.rabbitmq.fhir.routingkey=fhir.message.routing
app.rabbitmq.fhir.queue=fhir-to-v2-queue
app.rabbitmq.v2.output-queue=v2-messages-output-queue

# RabbitMQ Performance Tuning
spring.rabbitmq.listener.simple.concurrency=5
spring.rabbitmq.listener.simple.max-concurrency=10
spring.rabbitmq.listener.simple.prefetch=50
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.cache.connection.mode=CONNECTION
spring.rabbitmq.cache.channel.size=25
spring.rabbitmq.cache.channel.checkout-timeout=5000
spring.rabbitmq.connection-timeout=10000
spring.rabbitmq.requested-heartbeat=60

# FHIR DLQ
app.rabbitmq.fhir.dlq=fhir-to-v2-dlq
app.rabbitmq.fhir.dlx=fhir-to-v2-dlx
app.rabbitmq.fhir.dl-routingkey=fhir.message.dl

# MongoDB Performance
spring.data.mongodb.auto-index-creation=true

# HTTP/2 and Compression
server.http2.enabled=true
server.compression.enabled=true
server.compression.mime-types=application/json,application/fhir+json,text/plain
server.compression.min-response-size=1024

# Thread Pool for Async Operations
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-

# Webhook Configuration
app.webhook.max-retries=3
app.webhook.retry-delay-ms=1000

# Batch Configuration
app.batch.max-size=100

# Connection Timeouts
server.tomcat.connection-timeout=20000
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-connections=10000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# ============================================================================
# Redis Configuration
# ============================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:supersecret}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# ============================================================================
# Observability (Tracing & Metrics)
# ============================================================================
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# ============================================================================
# Resilience4j Circuit Breakers
# ============================================================================
resilience4j.circuitbreaker.instances.webhook.sliding-window-size=10
resilience4j.circuitbreaker.instances.webhook.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.webhook.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.webhook.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.webhook.automatic-transition-from-open-to-half-open-enabled=true

# ============================================================================
# API Key Authentication (X-API-Key header)
# Configure one entry per integration system: app.api-keys.<name>=<key>
# Keys should be overridden via environment variables in production.
# ============================================================================
app.api-keys.tenant1=${API_KEY_TENANT1:tenant1-key-123}
app.api-keys.demo=${API_KEY_DEMO:demo-key-456}

# Application version (shown in /api/health)
app.version=0.0.1-SNAPSHOT

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
